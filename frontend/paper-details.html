<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Details | Smart PYQ System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="details">
  <div id="app-shell"></div>
  <main class="main-content">
    <a class="back-link" href="explore.html">← Back to papers</a>
    <div class="page-heading detail-heading">
      <div><p class="eyebrow">PAPER DETAILS</p><h1>Question paper</h1><p class="muted">Read the original uploaded PDF.</p></div>
      <div class="pdf-actions"><button class="button ghost" id="fullscreen-paper" type="button">⛶ Full Screen</button><button class="button primary" id="download-paper" type="button">↓ Download PDF</button></div>
    </div>
    <section class="card pdf-viewer-card">
      <div class="section-heading"><div><h2 id="detail-title">Loading paper...</h2><p class="muted" id="detail-subtitle"></p></div><span class="badge soft">PDF DOCUMENT</span></div>
      <div class="pdf-preview"><iframe id="pdf-viewer" title="Question paper PDF" loading="lazy" allow="fullscreen" style="width:100%;height:calc(100vh - 250px);min-height:620px;border:0;border-radius:8px;background:#fff"></iframe><div class="state hidden" id="pdf-unavailable"><h3>PDF unavailable</h3><p>We could not load the original PDF for this paper.</p></div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/mock-data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script>
</body>
</html>
