<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Question Bank | Smart PYQ System</title><link rel="stylesheet" href="css/styles.css"></head><body data-page="questions"><div id="app-shell"></div><main class="main-content"><div class="page-heading"><div><p class="eyebrow">STUDY LIBRARY</p><h1>Question bank</h1><p class="muted">Every extracted question, organized for focused revision.</p></div><span class="badge soft">Live database</span></div><section class="card filter-card"><div class="search-field"><span>⌕</span><input id="question-search" placeholder="Search question text..."></div><div class="filter-row"><select id="question-subject"><option value="">All subjects</option></select><select id="question-year"><option value="">All exam years</option></select></div></section><section class="card table-card"><div class="section-heading"><div><h2>Extracted questions <span class="count-pill" id="question-count"></span></h2><p class="muted" id="question-status">Loading questions from the Flask API...</p></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Question</th><th>Subject</th><th>Paper</th><th>Exam year</th></tr></thead><tbody id="questions-table"></tbody></table></div><div class="state empty-state hidden" id="questions-empty"><span class="state-icon">☷</span><h3>No questions found</h3><p id="questions-empty-copy">Try a different search phrase.</p></div></section></main><div class="toast" id="toast"></div><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
